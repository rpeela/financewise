# Static site served from the repository root (no build step required)
[build]
  base = ""
  publish = "."
  command = ""

# GA_MEASUREMENT_ID is a public analytics identifier (G-JVJQR6M29L) that is
# intentionally embedded in index.html, so exclude it from secrets scanning.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "GA_MEASUREMENT_ID"
